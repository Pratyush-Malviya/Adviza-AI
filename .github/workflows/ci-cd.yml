name: CI/CD Pipeline - Adviza AI Multi-Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    name: Test & Build All Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install & Build Website
        run: |
          cd adviza-website
          npm ci
          npm run build

      - name: Install & Build Backend
        run: |
          cd adviza-backend
          npm ci
          npm run build

      - name: Install & Build Frontend App
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          cd adviza-frontend
          npm ci
          npm run build

  deploy-backend-ecs:
    name: Deploy Backend to AWS ECS Fargate
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify AWS Deployment Configuration
        id: check-aws
        env:
          AWS_ROLE_ARN: ${{ secrets['AWS_ROLE_ARN'] }}
          AWS_ACCESS_KEY_ID: ${{ secrets['AWS_ACCESS_KEY_ID'] }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ] || [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️ AWS deployment credentials not configured in repository secrets. Skipping AWS ECS deployment."
          fi

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets['AWS_ROLE_ARN'] }}
          aws-access-key-id: ${{ secrets['AWS_ACCESS_KEY_ID'] }}
          aws-secret-access-key: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
          role-session-name: AdvizaGitHubDeploySession
          aws-region: ${{ secrets['AWS_REGION'] || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        if: steps.check-aws.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets['ECR_REPOSITORY'] || 'adviza-backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./adviza-backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update ECS Task Definition & Service
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          aws ecs update-service --cluster ${{ secrets['ECS_CLUSTER'] || 'production-adviza-cluster' }} --service ${{ secrets['ECS_SERVICE'] || 'production-adviza-service' }} --force-new-deployment --region ${{ secrets['AWS_REGION'] || 'us-east-1' }}
