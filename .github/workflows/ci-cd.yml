name: CI/CD Pipeline - Adviza AI Multi-Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    name: Test & Build All Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install & Build Website
        run: |
          cd adviza-website
          npm ci
          npm run build

      - name: Install & Build Backend
        run: |
          cd adviza-backend
          npm ci
          npm run build

      - name: Install & Build Frontend App
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          cd adviza-frontend
          npm ci
          npm run build
